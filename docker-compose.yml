services:
  broker:
    platform: linux/amd64
    image: eclipse-mosquitto:latest
    container_name: fleet-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:Z
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - fleet-net

  backend:
    platform: linux/amd64
    build: .
    container_name: fleet-backend
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=broker
      - MQTT_PORT=1883
    depends_on:
      broker:
        condition: service_healthy
    command: uv run python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - fleet-net

  simulation:
    platform: linux/amd64
    build: .
    container_name: fleet-simulation
    environment:
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - PYTHONPATH=/app/robot:/app
    depends_on:
      broker:
        condition: service_healthy
      backend:
        condition: service_started
    command: uv run python robot/fleet_orchestrator.py
    restart: "no"
    networks:
      - fleet-net

networks:
  fleet-net:
    driver: bridge
